name: Update Publications from Google Scholar

# Same Scholar-blocks-datacenter-IPs problem as update-citations.yml. Here a
# transient block only warns and never fails the run: this job is quarterly, so
# a staleness gate of its own would be meaningless. update-citations.yml runs
# three times a week and goes red if Scholar stays unreachable for 14 days, so
# a durable outage is already alarmed on there — no need to duplicate it.

on:
  schedule:
    # Off the top of the hour; see the note in update-citations.yml.
    - cron: "23 3 1 1,4,7,10 *" # Quarterly: Jan 1, Apr 1, Jul 1, Oct 1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-publications:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Save current papers.bib hash
        id: before
        run: |
          if [ -f _bibliography/papers.bib ]; then
            sha_before=$(sha256sum _bibliography/papers.bib | awk '{print $1}')
            echo "sha_before=$sha_before" >> $GITHUB_OUTPUT
          else
            echo "sha_before=none" >> $GITHUB_OUTPUT
          fi

      - name: Fetch new publications
        shell: bash
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: |
          if [ -z "${SCRAPER_API_KEY}" ]; then
            echo "::notice::SCRAPER_API_KEY is not set — querying Google Scholar directly, which Actions IPs are often blocked from."
          fi

          attempts=3
          status=1
          for attempt in $(seq 1 "$attempts"); do
            echo "── Attempt $attempt of $attempts ──"
            # `status=$?` belongs in the else branch: after a closed `if`,
            # $? is the status of the `if` itself (0), not the command.
            if timeout 180 python bin/update_scholar_publications.py; then
              status=0
              break
            else
              status=$?
            fi
            echo "Attempt $attempt exited with status $status."
            if [ "$attempt" -lt "$attempts" ]; then
              backoff=$(( attempt * 45 + RANDOM % 30 ))
              echo "Retrying in ${backoff}s..."
              sleep "$backoff"
            fi
          done

          # timeout(1) reports 124 for a hung fetch; same class as exit 75.
          if [ "$status" -eq 124 ]; then
            status=75
          fi

          if [ "$status" -eq 0 ]; then
            echo "✅ Publication sync completed." | tee -a $GITHUB_STEP_SUMMARY
            exit 0
          fi

          if [ "$status" -eq 75 ]; then
            echo "::warning::Google Scholar was unreachable; papers.bib left unchanged. update-citations.yml will fail if this persists."
            echo "⚠️ Google Scholar unreachable — papers.bib left unchanged." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          echo "❌ Publication sync failed with exit code $status (not a Scholar availability problem)." | tee -a $GITHUB_STEP_SUMMARY
          exit "$status"

      - name: Save new papers.bib hash
        id: after
        run: |
          if [ -f _bibliography/papers.bib ]; then
            sha_after=$(sha256sum _bibliography/papers.bib | awk '{print $1}')
            echo "sha_after=$sha_after" >> $GITHUB_OUTPUT
          else
            echo "sha_after=none" >> $GITHUB_OUTPUT
          fi

      - name: Report changes
        run: |
          if [ "${{ steps.before.outputs.sha_before }}" != "${{ steps.after.outputs.sha_after }}" ]; then
            echo "New publications were added to papers.bib." >> $GITHUB_STEP_SUMMARY
          else
            echo "No new publications found." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Configure Git
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

      - name: Commit and push if changed
        run: |
          git add _bibliography/papers.bib
          git diff --staged --quiet || (
            git commit -m "Update publications from Google Scholar"
            git push
          )
