name: Test Python checks

on:
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/test-scholar-sync.yml"
      - "bin/update_scholar_citations.py"
      - "bin/update_scholar_publications.py"
      - "bin/check_site_html.py"
      - "tests/test_scholar_sync.py"
      - "tests/test_site_html.py"
      - "requirements.txt"
  pull_request:
    paths:
      - ".github/workflows/test-scholar-sync.yml"
      - "bin/update_scholar_citations.py"
      - "bin/update_scholar_publications.py"
      - "bin/check_site_html.py"
      - "tests/test_scholar_sync.py"
      - "tests/test_site_html.py"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Scholar dependencies
        run: pip install pyyaml scholarly==1.7.11
      - name: Run Python tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
